name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      SMS_DB_PATH: ":memory:"
      SMS_AI_MODE: mock
      SESSION_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Next 16 sinh kiểu PageProps/LayoutProps vào .next/types; tsc cần chúng
      - name: Generate route types
        run: npx next typegen
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npx eslint .
      - name: Unit / integration tests
        run: npm test --if-present
      - name: Build
        run: npx next build
